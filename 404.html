<!DOCTYPE HTML>
<html lang="en">
  <head>
    <title>404 Not Found | 页面未找到</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" media="(prefers-color-scheme:dark)" href="{{ site.favicon_dark | remove: './' | relative_url }}" type="image/png" />
    <link rel="icon" media="(prefers-color-scheme:light)" href="{{ site.favicon | remove: './' | relative_url }}" type="image/png" />
    <script src="{{ '/assets/js/favicon-switcher.js' | relative_url }}" type="application/javascript"></script>

    {% include font-links.html %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="wrapper" style="margin-top: 4rem; text-align: center;">
      <main>
        <h1 class="page-title">404 Not Found</h1>
        <p class="page-lead">This page could not be found.</p>
        <p lang="zh-CN">未找到该页面。</p>
        <p>You will be redirected to the homepage in 5 seconds. <span lang="zh-CN">页面将在 5 秒后返回首页。</span></p>
        <p><a href="{{ '/' | relative_url }}">Return home / <span lang="zh-CN">返回首页</span></a></p>
        <script>
          window.setTimeout(function () {
            window.location.href = '/';
          }, 5000);
        </script>
      </main>
    </div>
  </body>
</html>
