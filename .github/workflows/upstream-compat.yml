name: Upstream compatibility

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with upstream
        shell: pwsh
        run: ./scripts/check-upstream-compat.ps1 -Fetch
