name: Site checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Check translation freshness
        run: ruby scripts/check-translations.rb
      - name: Build site
        run: bundle exec jekyll build
      - name: Validate localized output
        run: ruby scripts/validate-site.rb
