<script>
  function closeNavMenu() {
    var links = document.getElementById('myLinks');
    var button = document.querySelector('.topnav .icon');
    if (!links || !button) return;
    links.classList.remove('open');
    button.classList.remove('active');
    button.setAttribute('aria-expanded', 'false');
    button.setAttribute('aria-label', button.dataset.labelOpen);
  }

  function myFunction() {
    var links = document.getElementById('myLinks');
    var button = document.querySelector('.topnav .icon');
    if (!links || !button) return;
    var isOpen = links.classList.toggle('open');
    button.classList.toggle('active', isOpen);
    button.setAttribute('aria-expanded', String(isOpen));
    button.setAttribute('aria-label', isOpen ? button.dataset.labelClose : button.dataset.labelOpen);
  }

  document.addEventListener('DOMContentLoaded', function () {
    var links = document.getElementById('myLinks');
    if (links) {
      links.querySelectorAll('a').forEach(function (anchor) {
        anchor.addEventListener('click', closeNavMenu);
      });
    }
    var switcher = document.querySelector('.topnav .language-link');
    if (switcher && switcher.dataset.switchLang) {
      switcher.addEventListener('click', function () {
        try {
          window.localStorage.setItem('site_lang', switcher.dataset.switchLang);
        } catch (e) {}
      });
    }
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeNavMenu();
      }
    });
  });
</script>
