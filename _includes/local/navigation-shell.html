{% assign page_lang = page.lang | default: site.lang | default: 'en' %}
{% assign strings = site.data.i18n[page_lang] %}
<nav class="topnav" aria-label="{{ strings.accessibility.primary_navigation }}">
  <div id="myLinks">
    {% include local/navigation.html %}
  </div>
  <button type="button" class="icon" onclick="myFunction()" aria-label="{{ strings.accessibility.open_menu }}" aria-controls="myLinks" aria-expanded="false" data-label-open="{{ strings.accessibility.open_menu }}" data-label-close="{{ strings.accessibility.close_menu }}">
    <span class="icon-wrap">
      <i class="fa fa-bars icon-bars" aria-hidden="true"></i>
      <i class="fa fa-xmark icon-xmark" aria-hidden="true"></i>
    </span>
  </button>
</nav>
